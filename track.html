<head>

<meta name="description" content="Track your Vanta Skin order.">
<meta property="og:title" content="Track Your Order | Vanta Skin">
<meta property="og:description" content="Track your Vanta Skin order.">
<meta property="og:image" content="assets/img/balm-open.jpg">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="track">
<div id="site-header"></div>
<main>

<section class="page-head"><div class="container"><span class="eyebrow">Orders</span><h1>Track Your Order</h1><p class="muted">Once your order ships, you'll receive an email with your tracking number.</p></div></section>
<section class="section"><div class="container" style="max-width:560px">
  <form data-simple="Thanks — we'll email your latest tracking details to the address on file within 1 business day." novalidate>
    <label for="on">Order number</label><input id="on" name="order" required>
    <label for="oe" style="margin-top:12px">Email used at checkout</label><input id="oe" name="email" type="email" required>
    <button class="btn block" type="submit" style="margin-top:18px">Look Up Order</button>
    <div class="form-msg"></div>
  </form>
  <p class="muted" style="margin-top:24px;font-size:.9rem">Can't find your tracking email? Check your spam folder or contact us at <span data-s="email"></span>.</p>
</div></section>
</main>
<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/products.js"></script>
